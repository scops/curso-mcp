[project]
name = "curso-mcp-ejercicios"
version = "0.1.0"
description = "Ejemplos y ejercicios del curso de MCP en Python"
requires-python = ">=3.11"

dependencies = [
  # Dependencias comunes a la mayoría de ejercicios
  "anthropic>=0.40.0",
  "python-dotenv>=1.2.2",
  # SDK MCP (protocolo 2026-07-28, stateless)
  "mcp>=2.2,<3",
  # Herramientas usadas en algunos ejercicios
  "streamlit>=1.38.0",
  "arxiv>=1.4.8",
  "openai>=1.40.0",
  "httpx>=0.27.0",
  # Cliente MySQL para el ejercicio 8 (sakila)
  "mysql-connector-python>=8.0.0",
  # Integración LangChain + MCP para el ejercicio 11 (extra/avanzado, no
  # forma parte del temario principal). `langchain-mcp-adapters` todavía
  # fija `mcp<2.0.0`, incompatible con el resto del curso (mcp v2), así que
  # usamos el soporte nuevo integrado en LangChain (`langchain.mcp`), que
  # SÍ soporta mcp v2 pero está en beta (API sujeta a cambios; revisar antes
  # de cada edición del curso).
  "langchain[mcp]>=1.4.0",
  # Stack LangChain/SQL agent para el ejercicio 11
  "langchain-community>=0.4.2",
  "langchain-anthropic>=0.3.22",
  # Observabilidad con Langfuse
  "langfuse>=3.0.0",
  "opentelemetry-instrumentation-anthropic>=0.35.0",
]

[tool.uv]
# Configuración opcional de uv para el curso.
# Nota: dejamos que uv use su mecanismo por defecto
# para elegir la versión de Python disponible (>=3.11).
